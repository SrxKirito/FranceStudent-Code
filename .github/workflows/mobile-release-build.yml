name: Préparer les applications mobiles
on:
  push:
    branches: [mobile-release-preparation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VERSION: 1.2.${{ github.run_number }}
      APP_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: for test in test-*.cjs; do node "$test"; done
      - run: node scripts/verify-iphone.cjs
      - run: bash scripts/build-iphone.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FranceStudent-iPhone-SideStore
          path: mobile/dist/FranceStudent-iPhone.ipa
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - run: for test in test-*.cjs; do node "$test"; done
      - run: node scripts/prepare-android.cjs
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: FranceStudent-Android-verification
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
